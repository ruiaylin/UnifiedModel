kind: entity_set
schema:
  url: "umodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "ops.environment"
  domain: ops
  display_name:
    en_us: "Environment"
    zh_cn: "环境"
  description:
    en_us: "A deployment environment such as production, staging, or development."
    zh_cn: "部署环境，如生产、预发布或开发环境。"
spec:
  fields:
    - name: id
      type: string
      display_name: { en_us: "ID", zh_cn: "ID" }
    - name: display_name
      type: string
      display_name: { en_us: "Name", zh_cn: "名称" }
    - name: env_type
      type: string
      display_name: { en_us: "Type", zh_cn: "类型" }
    - name: region
      type: string
      display_name: { en_us: "Region", zh_cn: "地域" }
    - name: datacenter
      type: string
      display_name: { en_us: "Datacenter", zh_cn: "数据中心" }
    - name: status
      type: string
      display_name: { en_us: "Status", zh_cn: "状态" }
  primary_key_fields:
    - id
  id_generator: "id"
  name_fields:
    - display_name
  ordered_fields: ["id", "display_name", "env_type", "region", "datacenter"]
  first_observed_time_field: "__first_observed_time__"
  last_observed_time_field: "__last_observed_time__"

kind: entity_set
schema:
  url: "umodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "apm.service"
  domain: apm
  display_name:
    en_us: "Service"
    zh_cn: "服务"
  description:
    en_us: "A deployable software service in the APM domain."
    zh_cn: "APM 域中的可部署软件服务。"
spec:
  fields:
    - name: id
      type: string
      display_name: { en_us: "ID", zh_cn: "ID" }
    - name: display_name
      type: string
      display_name: { en_us: "Name", zh_cn: "名称" }
    - name: status
      type: string
      display_name: { en_us: "Status", zh_cn: "状态" }
    - name: owner
      type: string
      display_name: { en_us: "Owner", zh_cn: "负责团队" }
    - name: environment
      type: string
      display_name: { en_us: "Environment", zh_cn: "环境" }
    - name: repo_path
      type: string
      display_name: { en_us: "Repository Path", zh_cn: "代码仓库路径" }
    - name: language
      type: string
      display_name: { en_us: "Language", zh_cn: "语言" }
    - name: runtime_platform
      type: string
      display_name: { en_us: "Runtime Platform", zh_cn: "运行平台" }
    - name: exposure
      type: string
      display_name: { en_us: "Exposure", zh_cn: "暴露范围" }
    - name: contact_channel
      type: string
      display_name: { en_us: "Contact Channel", zh_cn: "联系渠道" }
  primary_key_fields:
    - id
  id_generator: "id"
  name_fields:
    - display_name
  ordered_fields: ["id", "display_name", "status", "owner", "environment", "repo_path"]
  first_observed_time_field: "__first_observed_time__"
  last_observed_time_field: "__last_observed_time__"

kind: metric_set
schema:
  url: "umodel.aliyun.com"
  version: "v1.0.0"
metadata:
  name: "apm.metric.service"
  domain: apm
  display_name:
    en_us: "Service Golden Metrics"
    zh_cn: "服务黄金指标"
  description:
    en_us: "Golden metrics (latency, throughput, error rate) for APM services."
    zh_cn: "APM 服务的黄金指标（延迟、吞吐、错误率）。"
spec:
  labels:
    keys:
      - name: service_id
        type: string
        display_name:
          en_us: "Service ID"
          zh_cn: "服务 ID"
      - name: environment
        type: string
        display_name:
          en_us: "Environment"
          zh_cn: "环境"
    dynamic: false
  metrics:
    - name: request_count
      display_name:
        en_us: "Request Count"
        zh_cn: "请求数"
      unit: count
      data_format: KMB
      type: counter
      query_mode: range
      generator: "sum(rate(http_requests_total{service_id=\"$service_id\"}[5m]))"
      aggregator: sum
      golden_metric: true
    - name: error_count
      display_name:
        en_us: "Error Count"
        zh_cn: "错误数"
      unit: count
      data_format: KMB
      type: counter
      query_mode: range
      generator: "sum(rate(http_errors_total{service_id=\"$service_id\"}[5m]))"
      aggregator: sum
      golden_metric: true
    - name: latency_p99_ms
      display_name:
        en_us: "P99 Latency"
        zh_cn: "P99 延迟"
      unit: ms
      data_format: ms
      type: gauge
      query_mode: range
      generator: "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service_id=\"$service_id\"}[5m])) by (le)) * 1000"
      aggregator: avg
      golden_metric: true
  query_type: prom
  needs_processing: true

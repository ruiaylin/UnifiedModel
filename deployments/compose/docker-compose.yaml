services:
  umodel-server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    command:
      - "--addr"
      - ":8080"
      - "--data"
      - "/data"
      - "--graphstore"
      - "${UMODEL_GRAPHSTORE:-postgres.age}"
      - "--graph-prefix"
      - "${UMODEL_GRAPH_PREFIX:-ws_}"
      - "--quickstart"
    environment:
      UMODEL_DSN: ${UMODEL_DSN:-}
      UMODEL_GRAPH_PREFIX: ${UMODEL_GRAPH_PREFIX:-ws_}
      UMODEL_GRAPHSTORE: ${UMODEL_GRAPHSTORE:-postgres.age}
    ports:
      - "${UMODEL_SERVER_PORT:-8082}:8080"
    restart: unless-stopped
    volumes:
      - umodel-data:/data

  umodel-web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@9.15.9 --activate &&
      pnpm install --frozen-lockfile &&
      UMODEL_API_TARGET=${UMODEL_API_TARGET:-http://umodel-server:8080}
      pnpm dev --host 0.0.0.0 --port 5174"
    environment:
      UMODEL_API_TARGET: ${UMODEL_API_TARGET:-http://umodel-server:8080}
    ports:
      - "${UMODEL_WEB_PORT:-5174}:5174"
    restart: unless-stopped
    depends_on:
      - umodel-server
    volumes:
      - ../../web:/app
      - umodel-web-node-modules:/app/node_modules

volumes:
  umodel-data: {}
  umodel-web-node-modules: {}
